{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card p-4 p-md-4">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h4 class="mb-0">学生注册（队长）</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/">返回首页</a>
      </div>

      <div class="text-muted small mb-3">
        仅学生账号支持自助注册；评审专家/管理员账号由管理员创建。
      </div>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register">
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input class="form-control" name="username" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input class="form-control" name="password" type="password" required autocomplete="new-password">
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary" type="submit">注册并登录</button>
          <a class="btn btn-outline-primary" href="/login?role=student">已有账号？学生登录</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
