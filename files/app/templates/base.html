<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>校赛评分系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    :root{
      --brand-1:#0d6efd;
      --brand-2:#0a58ca;
      --bg-1:#f6f8fc;
    }

    body{
      background: var(--bg-1);
    }

    .app-navbar{
      background: rgba(255,255,255,.85) !important;
      backdrop-filter: blur(8px);
    }

    .app-title{
      font-weight: 700;
      letter-spacing: .2px;
    }

    .pdf-pane { height: calc(100vh - 160px); border: 1px solid #ddd; background: #fff; }
    .score-pane { height: calc(100vh - 160px); overflow: auto; }

    .card{
      border: 0;
      box-shadow: 0 8px 24px rgba(16,24,40,.08);
      border-radius: 14px;
    }

    .btn{
      border-radius: 12px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light border-bottom app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand app-title" href="/">校赛评分系统</a>

    <div class="d-flex align-items-center gap-2">
      {% if user %}
        <span class="text-muted small">当前用户：{{ user.username }}（{{ user.role }}）</span>
        <form method="post" action="/logout" class="mb-0">
          <button class="btn btn-outline-secondary btn-sm" type="submit">退出</button>
        </form>
      {% else %}
        {# 未登录时：不在顶栏放“登录/注册”，统一从首页入口进入 #}
        <a class="btn btn-outline-primary btn-sm" href="/">进入登录入口</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container-fluid my-3">
  {% block content %}{% endblock %}
</div>
</body>
</html>
